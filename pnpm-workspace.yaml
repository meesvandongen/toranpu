packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@swc/core": false
  core-js: false
  core-js-pure: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5

# vite-plus provides `vite` and `vitest` through its own core; point every copy at it.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
